  - aid: fudan:identity-saml
    name: Fudan University Shibboleth Identity Provider (CARSI / eduGAIN)
    x-operator: institution
    description: >-
      Fudan's SAML 2.0 identity provider, entityID https://idpfudan.fudan.edu.cn/idp/shibboleth,
      asserting scope fudan.edu.cn. It is registered with CARSI, China's education federation,
      and interfederated into eduGAIN, where it has carried entity id 671764 since 2020-02-12.
      Fudan serves the metadata itself: a 14,734-byte EntityDescriptor with both an
      IDPSSODescriptor and an AttributeAuthorityDescriptor, supporting SAML 2.0, SAML 1.1 and
      the Shibboleth 1.0 profile. This is a machine-readable institutional surface that almost
      no university in this cohort has catalogued, and it is the basis of the shibboleth and
      saml conformance recorded here. One operational note: the self-served copy still carries
      the stock Shibboleth mdui:DisplayName ("A Name for the IdP at idpfudan.fudan.edu.cn"),
      while the CARSI-registered copy carries the proper English and Chinese names.
    humanURL: https://idpfudan.fudan.edu.cn/idp/shibboleth
    baseURL: https://idpfudan.fudan.edu.cn/idp
    tags: [ Identity Federation, SAML, Shibboleth, eduGAIN, CARSI ]
