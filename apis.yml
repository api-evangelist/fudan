x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    Fudan operates real, institution-owned surfaces and two of them publish machine-readable
    metadata anonymously — the SAML 2.0 IdP metadata at idpfudan.fudan.edu.cn/idp/shibboleth
    and the OpenID Connect discovery document plus JWKS at id.fudan.edu.cn/idp. Those are
    captured and described here in full. Everything the institution actually runs behind
    them is closed: the OIDC endpoints need a client_id issued by the IT Office and there is
    no public registration; the research data platform's JSON backend answers every
    unauthenticated call with HTTP 200 and the body {"status":4000,"message":"状态锁不得为空"}.
    No developer portal, no API key programme and no documentation exists for any of it.
    This is not a bot block and not a language barrier — Chinese-language surfaces were
    searched and read, and the Chinese Information Technology Office pages were the source
    for several corrections here.
