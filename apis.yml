    name: Fudan University Unified Identity — OpenID Connect
    x-operator: institution
    description: >-
      The OpenID Connect provider Fudan operates for campus single sign-on at
      id.fudan.edu.cn. Issuer https://id.fudan.edu.cn/idp. The discovery document and the
      JWKS are both served anonymously and were captured live on 2026-08-30; the endpoints
      they point at require a client_id issued by the Information Technology Office, and
      there is no public client registration. The OpenAPI in this repository is DERIVED from
      Fudan's own discovery document, not published by Fudan. One defect is recorded as
      observed: the end-session endpoint is declared under the member name
      "end_session_endpoint " with a trailing space, so a strict discovery client will miss it.
