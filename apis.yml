description: >-
  Fudan University is a public research university in Shanghai, China, and a member of the
  national C9 League and Double First-Class programme. Its programmable footprint is small
  and almost entirely internal, but — unusually for this cohort — none of it is a vendor's
  contract wearing the university's name: every surface catalogued here runs on a host under
  fudan.edu.cn and is operated by Fudan itself. The real find is identity federation. Fudan
  operates a Shibboleth SAML 2.0 identity provider, registered with the CARSI federation and
  published to eduGAIN since February 2020, and it serves its own SAML metadata live at
  idpfudan.fudan.edu.cn. Alongside it, id.fudan.edu.cn publishes a working OpenID Connect
  discovery document and JWKS with no authentication required. Both are genuinely
  machine-readable and neither is documented anywhere Fudan publishes. Beyond identity, the
  Social Science Data Platform migrated off Dataverse to a custom application at
  rdr.fudan.edu.cn/datahome; its JSON backend answers, but it is undocumented, session-bound,
  and returns application-level refusals with HTTP 200. There is no developer portal, no
  public API key programme, no OAI-PMH, no open data portal, no robots.txt and no llms.txt on
  the main site, and the official GitHub organisation has zero public repositories — the
  university's public code lives instead in departmental lab organisations.
