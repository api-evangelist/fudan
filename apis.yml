  - aid: fudan:research-data-platform
    name: Fudan University Social Science Data Platform (复旦大学社会科学数据平台)
    x-operator: institution
    description: >-
      Fudan's institutional research data repository, operated by the Research Center for
      Social Sciences. It moved off Dataverse: dvn.fudan.edu.cn now only meta-refreshes to
      rdr.fudan.edu.cn/datahome, which is a Vue single-page application over a Spring Boot
      backend. That backend is live and returns JSON, but it is undocumented, session-bound,
      and refuses unauthenticated calls with HTTP 200 and an in-body status 4000. No Dataverse
      REST API, no OAI-PMH and no published API of any kind responds on either host, so no
      contract is saved for this surface. re3data still records the software as Dataverse and
      the PID system as Handle; that record was last updated 2025-07-24 and is stale.
    humanURL: https://rdr.fudan.edu.cn/datahome/open/dataResource
    tags: [ Research Data, Research Repository, Undocumented, Gated ]
