name: Fudan University
description: Fudan University public developer/API footprint review for APIs.json cataloging.
url: https://raw.githubusercontent.com/api-evangelist/fudan/refs/heads/main/review.yml
created: '2026-06-03'
modified: '2026-08-30'
reviews:
- date: '2026-06-03'
  rating: 1
  summary: No openly documented, publicly reachable developer API program was found for Fudan University.
    The official website and English site resolve. A Fudan University Dataverse research-data repository
    exists at dvn.fudan.edu.cn; the host returns HTTP 200 but serves an access-forbidden ("禁止访问") page
    to requests from outside mainland China, so the standard Dataverse REST API and OAI-PMH endpoints
    could not be verified live and are effectively geo-gated. The official GitHub organization (github.com/FudanUniversity)
    exists but has zero public repositories. No endpoints, keys, or specs were fabricated; only confirmed
    properties are cataloged.
  endpoints:
  - url: https://www.fudan.edu.cn
    status: 200
    note: Official Fudan University website resolves.
  - url: https://www.fudan.edu.cn/en/
    status: 200
    note: English-language site resolves.
  - url: https://dvn.fudan.edu.cn
    status: 200
    note: Fudan Dataverse host responds but body is an access-forbidden page from outside China.
  - url: https://dvn.fudan.edu.cn/api/info/version
    status: 200
    note: Standard Dataverse API path; returns geo-block page, not JSON. API gated.
  - url: https://dvn.fudan.edu.cn/oai?verb=Identify
    status: 200
    note: Standard Dataverse OAI-PMH path; returns geo-block page, not OAI XML. Gated.
  - url: https://github.com/FudanUniversity
    status: 200
    note: Official GitHub org exists, links to fudan.edu.cn, but no public repositories.
  - url: https://www.linkedin.com/school/fudan-university/
    status: 999
    note: LinkedIn school page exists; 999 is LinkedIn anti-bot response, not absence.
- date: '2026-08-30'
  rating: 2
  summary: 'Re-profiled under the university pipeline, with operator attribution settled before anything
    was saved. Fudan is a clean institution case: zero vendor-operated surfaces and zero tenant surfaces
    were attributed to it, and probing confirmed it — fudan.figshare.com returns an empty 202, fudan.pure.elsevier.com
    redirects to an NXDOMAIN host, fudan.on.worldcat.org 500s and fudan.instructure.com says Canvas cannot
    find a login page. Every surface catalogued is on a fudan.edu.cn host and run by Fudan. The find is
    identity federation: Fudan serves its own Shibboleth SAML 2.0 metadata at idpfudan.fudan.edu.cn/idp/shibboleth,
    registered with CARSI and published to eduGAIN since 2020-02-12, and a working OpenID Connect discovery
    document plus JWKS at id.fudan.edu.cn/idp, all anonymously readable. Three claims from the 2026-06-03
    review were wrong and are corrected: dvn.fudan.edu.cn is not geo-blocked, it meta-refreshes to a new
    platform at rdr.fudan.edu.cn/datahome; there is no Dataverse REST API or OAI-PMH — both return 404,
    and the old entry admitted its endpoint paths were Dataverse conventions rather than anything Fudan
    published; and the vulnerability disclosure page recorded on 2026-07-11 cannot be shown to have existed,
    so that claim is withdrawn. Nothing was fabricated; the OpenAPI here is derived from Fudan''s own
    live discovery document and says so.'
  endpoints:
  - url: https://www.fudan.edu.cn
    status: 200
    note: Official site. No robots.txt (404), no llms.txt (404), no security.txt (404).
  - url: https://www.fudan.edu.cn/en/
    status: 200
    note: English site resolves.
  - url: https://idpfudan.fudan.edu.cn/idp/shibboleth
    status: 200
    note: LIVE SAML 2.0 IdP metadata, application/xml, 14,734 bytes. Institution-operated.
  - url: https://id.fudan.edu.cn/idp/.well-known/openid-configuration
    status: 200
    note: LIVE OpenID Connect discovery document, application/json. Issuer https://id.fudan.edu.cn/idp.
  - url: https://id.fudan.edu.cn/idp/oidc/getPublicKey
    status: 200
    note: LIVE JWKS, one RS256 RSA key.
  - url: https://technical.edugain.org/api.php?action=list_entities&format=json
    status: 200
    note: Fudan entity 671764, regauth carsi.edu.cn, scope fudan.edu.cn, first seen 2020-02-12.
  - url: https://dvn.fudan.edu.cn
    status: 200
    note: 'CORRECTION: not a geo-block page. 341-byte meta-refresh to https://rdr.fudan.edu.cn/datahome/.'
  - url: https://dvn.fudan.edu.cn/api/info/version
    status: 404
    note: 'CORRECTION: previously recorded 200. No Dataverse API.'
  - url: https://dvn.fudan.edu.cn/oai?verb=Identify
    status: 404
    note: 'CORRECTION: previously recorded 200. No OAI-PMH.'
  - url: https://rdr.fudan.edu.cn/datahome/
    status: 200
    note: Current research data platform. Vue SPA over a Spring Boot backend.
  - url: https://rdr.fudan.edu.cn/datahome/open/admin/loginUserInfo.do
    status: 200
    note: 'Live JSON backend, refuses unauthenticated calls in-body: status 4000, 状态锁不得为空.'
  - url: https://library.fudan.edu.cn/oai?verb=Identify
    status: 200
    note: Soft 404 — 200 with a generic HTML page, not an OAI-PMH response.
  - url: https://jwc.fudan.edu.cn/
    status: 200
    note: Registrar (教务处) site. Course selection at xk.fudan.edu.cn redirects to SSO. No API.
  - url: https://uis.fudan.edu.cn/
    status: 200
    note: Legacy SSO; serves a service-termination notice.
  - url: https://xxb.fudan.edu.cn/8283/list.htm
    status: 200
    note: IT Office network security section. Internal services only; no disclosure channel.
  - url: https://www.fudan.edu.cn/vulnerability-disclosure/main.psp
    status: 502
    note: WITHDRAWN source from the 2026-07-11 artifact. Unverifiable; no Wayback snapshot.
  - url: https://github.com/FudanUniversity
    status: 200
    note: 'Official org confirmed via GitHub API: 0 public repositories.'
  - url: https://github.com/FudanNLP
    status: 200
    note: NLP Group at Fudan University, 29 public repos. Institution lab.
  - url: https://github.com/FudanSELab
    status: 200
    note: Software Engineering Laboratory of Fudan University, 88 public repos. Institution lab.
  - url: https://github.com/OpenMOSS
    status: 200
    note: 'REJECTED: self-describes as a research group under the Shanghai Innovation Institution, collaborating
      with Fudan. Not Fudan-operated.'
  - url: https://fudan.figshare.com/
    status: 202
    note: Wildcard, zero bytes. No Figshare tenant.
  - url: https://fudan.instructure.com/
    status: 404
    note: Canvas cannot find a login page. No Canvas tenant.
  - url: https://fudan.on.worldcat.org/
    status: 500
    note: No WorldCat Discovery tenant.
  - url: https://www.re3data.org/api/v1/repository/r3d100012775
    status: 200
    note: Third-party registry; still says Dataverse/Handle. Last updated 2025-07-24, stale.
  - url: https://www.linkedin.com/school/fudan-university/
    status: 999
    note: LinkedIn anti-bot response, not absence.
